<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly 🌸 — Stay Organized</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <div class="app-container">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
        <div class="logo">
          <span>Taskly</span>
          <span class="logo-flower">🌸</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <button class="nav-btn active" data-category="all">
          <span class="nav-icon">📋</span>
          <span class="nav-text">All tasks</span>
          <span class="badge" id="badgeAll">0</span>
        </button>
        <button class="nav-btn" data-category="today">
          <span class="nav-icon">☀️</span>
          <span class="nav-text">Due today</span>
          <span class="badge" id="badgeToday">0</span>
        </button>
        <button class="nav-btn" data-category="overdue">
          <span class="nav-icon">⏰</span>
          <span class="nav-text">Overdue</span>
          <span class="badge" id="badgeOverdue">0</span>
        </button>
        <button class="nav-btn" data-category="high">
          <span class="nav-icon">🔥</span>
          <span class="nav-text">High priority</span>
          <span class="badge" id="badgeHigh">0</span>
        </button>
        <button class="nav-btn" data-category="recurring">
          <span class="nav-icon">🔄</span>
          <span class="nav-text">Recurring</span>
          <span class="badge" id="badgeRecurring">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        Pick a list to filter your tasks.
      </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-wrapper">
      <!-- HEADER -->
      <header class="header-bar">
        <h1 class="greeting-title" id="greetingText">Good evening 🌸</h1>
        <button class="theme-btn" id="themeToggleBtn">
          <span id="themeIcon">🌙</span>
          <span id="themeText">Dark</span>
        </button>
      </header>

      <!-- DASHBOARD GRID -->
      <div class="dashboard-grid">

        <!-- LEFT COLUMN: CLOCK & TASKS -->
        <div class="dash-col main-col">

          <!-- DIGITAL CLOCK CARD -->
          <div class="glass-card clock-card">
            <div class="clock-time" id="clockTime">19:19</div>
            <div class="clock-label">Time</div>
          </div>

          <!-- ALL TASKS CARD -->
          <div class="glass-card tasks-card">
            <h2 class="card-title" id="activeCategoryTitle">All tasks</h2>

            <!-- STATS COUNTERS -->
            <div class="stats-row">
              <div class="stat-box">
                <span class="stat-value" id="statTotal">0</span>
                <span class="stat-label">Total</span>
              </div>
              <div class="stat-box">
                <span class="stat-value" id="statPending">0</span>
                <span class="stat-label">Pending</span>
              </div>
              <div class="stat-box">
                <span class="stat-value" id="statDone">0</span>
                <span class="stat-label">Done</span>
              </div>
            </div>

            <!-- TASK INPUT -->
            <div class="task-input-container">
              <input type="text" id="taskInput" class="task-input" placeholder="Add a task..." autocomplete="off">
              <button type="button" class="btn-icon" id="toggleOptionsBtn" title="Task options">⚙️</button>
              <button type="button" class="btn-add" id="addTaskBtn">+</button>
            </div>

            <!-- OPTIONS FORM DRAWER -->
            <div class="options-drawer hidden" id="optionsDrawer">
              <div class="options-grid">
                <div class="form-group">
                  <label for="prioritySelect">⚡ Priority</label>
                  <select id="prioritySelect">
                    <option value="none">⚪ None (0%)</option>
                    <option value="low">🟢 Low (30%)</option>
                    <option value="medium">🟡 Medium (60%)</option>
                    <option value="high" selected>🔴 High (80%)</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="deadlineInput">📅 Deadline</label>
                  <input type="datetime-local" id="deadlineInput">
                </div>
                <div class="form-group">
                  <label for="recurringSelect">🔄 Repeat</label>
                  <select id="recurringSelect">
                    <option value="none">None</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                  </select>
                </div>
                <div class="form-group full-width">
                  <label for="noteInput">📝 Note / Details</label>
                  <input type="text" id="noteInput" placeholder="Add a subtask or note..." maxlength="120">
                </div>
              </div>
            </div>

            <!-- FILTER TABS -->
            <div class="filter-tabs">
              <button class="tab-btn active" data-filter="all">All</button>
              <button class="tab-btn" data-filter="pending">Pending</button>
              <button class="tab-btn" data-filter="done">Done</button>
            </div>

            <!-- TASK LIST -->
            <ul class="task-list" id="taskList"></ul>

            <!-- EMPTY STATE -->
            <div class="empty-state hidden" id="emptyState">
              <span class="empty-emoji">🌸</span>
              <p>No tasks found in this section</p>
            </div>

            <!-- PROGRESS FOOTER -->
            <div class="progress-container">
              <div class="progress-text" id="progressText">0% completed ✨</div>
              <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
              </div>
            </div>
          </div>

        </div>

        <!-- RIGHT COLUMN: CALENDAR & FOCUS TIMER -->
        <div class="dash-col side-col">

          <!-- CALENDAR WIDGET -->
          <div class="glass-card calendar-card">
            <div class="cal-header">
              <button class="cal-nav" id="calPrevBtn">‹</button>
              <span class="cal-title" id="calTitle">October 2026</span>
              <button class="cal-nav" id="calNextBtn">›</button>
            </div>
            <div class="cal-grid-week">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="cal-grid-days" id="calDays"></div>
          </div>

          <!-- FOCUS TIMER WIDGET -->
          <div class="glass-card timer-card">
            <h3 class="widget-heading">Focus Timer</h3>

            <div class="timer-presets">
              <button class="preset-btn" data-sec="300">5 min</button>
              <button class="preset-btn" data-sec="600">10 min</button>
              <button class="preset-btn active" data-sec="1500">25 min</button>
              <button class="preset-btn" data-sec="2700">45 min</button>
              <button class="preset-btn" data-sec="3600">60 min</button>
            </div>

            <div class="timer-display" id="timerDisplay">25:00</div>

            <div class="timer-controls">
              <button class="btn-timer-start" id="timerStartBtn">Start</button>
              <button class="btn-timer-reset" id="timerResetBtn">Reset</button>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
